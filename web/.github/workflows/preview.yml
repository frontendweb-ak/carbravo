name: CarBravo Frontend Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: frontend-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.20.0"
  PNPM_VERSION: "11.9.0"

jobs:
  preview:
    name: Vercel Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm check

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:run

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel preview
        run: |
          vercel build \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Vercel preview
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy \
            --prebuilt \
            --token="${{ secrets.VERCEL_TOKEN }}")

          echo "deployment_url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const url = "${{ steps.deploy.outputs.deployment_url }}";

            const body = [
              "## CarBravo Preview Deployment",
              "",
              `Preview: ${url}`,
              "",
              "Quality checks, type checking, tests, and the production Vercel build completed successfully."
            ].join("\n");

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.data.find(
              comment =>
                comment.user.type === "Bot" &&
                comment.body.includes("CarBravo Preview Deployment")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }