name: CarBravo CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carbravo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.20.0"
  PNPM_VERSION: "11.9.0"

jobs:
  quality:
    name: Frontend and Hono quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting and lint
        run: pnpm --filter carbravo check

      - name: Typecheck frontend
        run: pnpm --filter carbravo typecheck

      - name: Typecheck Hono mock API
        run: pnpm --filter carbravo-server typecheck

  tests:
    name: Frontend unit and component tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter carbravo test:run

  build:
    name: Production builds
    runs-on: ubuntu-latest
    needs:
      - quality
      - tests
    env:
      VITE_APP_NAME: CarBravo Incentives
      VITE_APP_ENV: production
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_API_URL: https://api.example.com/api
      VITE_ENABLE_API_MOCKS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter carbravo build

      - name: Build Hono mock API
        run: pnpm --filter carbravo-server build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v6
        with:
          name: carbravo-frontend-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
